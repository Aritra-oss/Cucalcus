name: Build Cucalcus APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Verify Gradle installation
        run: gradle --version

      - name: Restore debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit and Robolectric tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cucalcus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Signed Release APK (when signing secrets configured)
        id: release_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
              -Dorg.gradle.workers.max=2
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping signed release APK (signing secrets not configured)."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK artifact
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cucalcus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
